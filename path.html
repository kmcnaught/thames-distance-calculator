<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d5016" />
  <title>Thames Path — on-trail distance</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    #brand {
      position: absolute; top: 12px; left: 12px; z-index: 500;
      background: #fff; padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 14px;
    }
    #brand strong { color: #2d5016; }
    #panel {
      position: absolute; bottom: 12px; left: 12px; right: 12px; z-index: 500;
      max-width: 420px; margin: 0 auto;
      background: #fff; border-radius: 10px; padding: 14px 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    #hint { margin: 0; font-size: 14px; color: #555; }
    #readout .big {
      font-size: 32px; font-weight: 600; color: #2d5016; line-height: 1.1;
    }
    #readout .unit { font-size: 14px; color: #666; font-weight: 400; margin-left: 6px; }
    #readout .secondary { margin-top: 4px; font-size: 13px; color: #666; }
    #readout .warn { margin-top: 6px; font-size: 13px; color: #a85300; }
    .actions { margin-top: 10px; display: flex; gap: 8px; }
    .actions button {
      flex: 1; padding: 8px; border: 1px solid #ccc; background: #f6f6f6;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .actions button:disabled { opacity: .4; cursor: not-allowed; }
    .pin-chip { display: inline-block; width: 18px; height: 18px; border-radius: 50%;
      color: #fff; text-align: center; line-height: 18px; font-size: 11px; font-weight: 700; }
    .pin-a { background: #e11d48; }
    .pin-b { background: #0891b2; }
    .band-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .leaflet-control-layers-overlays label { font-size: 13px; }
    .pop { font-size: 13px; line-height: 1.4; }
    .pop .pop-name { font-weight: 600; margin-bottom: 2px; }
    .pop .pop-meta { color: #666; font-size: 12px; }
    .pop .pop-band { margin-top: 4px; font-size: 12px; }
    .pop a { color: #2d5016; text-decoration: underline; }
    .pop .pop-link { margin-top: 4px; font-size: 12px; display: inline-block; word-break: break-all; }
    .attr { margin-top: 10px; font-size: 11px; color: #888; }
    .attr a { color: #888; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="brand"><strong>Thames Path</strong> — click two spots, see distance along the trail</div>

  <section id="panel">
    <p id="hint">Click the map to drop pin <span class="pin-chip pin-a">A</span>.</p>
    <div id="readout" hidden>
      <div><span id="miles" class="big">—</span><span class="unit">mi on the trail</span></div>
      <div class="secondary">
        <span id="km">— km</span> · <span id="straight">— straight</span>
      </div>
      <p id="warn" class="warn" hidden></p>
    </div>
    <div class="actions">
      <button id="btn-swap" disabled>Swap A ↔ B</button>
      <button id="btn-clear" disabled>Clear</button>
    </div>
    <div class="attr">
      Trail from OSM relation 14519665 (© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, ODbL).
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./path.js"></script>
</body>
</html>
