<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d5016" />
  <title>Thames Path — on-trail distance</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./lib/overlays.css" />
  <link rel="stylesheet" href="./lib/strip.css" />
  <link rel="stylesheet" href="./lib/brand.css" />
  <link rel="stylesheet" href="./lib/panel-toggle.css" />
  <link rel="stylesheet" href="./lib/distance-chip.css" />
  <style>
    :root { --brand-accent: #2d5016; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      max-width: 420px; margin: 0 auto;
      max-height: calc(100dvh - 80px);
      display: flex; flex-direction: column;
      background: #fff;
      border-top-left-radius: 16px; border-top-right-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      transition: transform 220ms ease;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    /* Peek matches COLLAPSED_PEEK_PX in lib/panel-swipe.mjs. */
    #panel.collapsed { transform: translateY(calc(100% - 80px)); }
    .panel-body { padding: 34px 16px 14px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
    #hint { margin: 0; font-size: 14px; color: #555; }
    #readout .big {
      font-size: 32px; font-weight: 600; color: #2d5016; line-height: 1.1;
    }
    #readout .unit { font-size: 14px; color: #666; font-weight: 400; margin-left: 6px; }
    #readout .secondary { margin-top: 4px; font-size: 13px; color: #666; }
    #readout .warn { margin-top: 6px; font-size: 13px; color: #a85300; }
    .actions { margin-top: 10px; display: flex; gap: 8px; }
    .actions button {
      flex: 1; padding: 8px; border: 1px solid #ccc; background: #f6f6f6;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .actions button:disabled { opacity: .4; cursor: not-allowed; }
    .check { display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: #555; margin-top: 10px; cursor: pointer; }
    .pin-chip { display: inline-block; width: 18px; height: 18px; border-radius: 50%;
      color: #fff; text-align: center; line-height: 18px; font-size: 11px; font-weight: 700; }
    .pin-a { background: #e11d48; }
    .pin-b { background: #0891b2; }
    .attr { margin-top: 10px; font-size: 11px; color: #888; }
    .attr a { color: #888; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #f1f5f9;
      padding: 4px; border-radius: 8px; }
    .tab { flex: 1; border: 0; background: transparent; font: inherit;
      font-size: 13px; font-weight: 500; color: #475569; padding: 6px 10px;
      border-radius: 6px; cursor: pointer; }
    .tab.active { background: white; color: #2d5016;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06); }
    .tab-panel[hidden] { display: none; }
    .strip-tab-hint { margin: 8px 0 0; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div id="map"></div>

  <header id="brand" aria-hidden="false">
    <span class="brand-mark">Thames Path</span>
    <span class="brand-sub">on-trail distance · Thames</span>
    <span class="brand-switch">also: <a href="./index.html">Thameswise (river)</a></span>
  </header>

  <section id="panel" class="expanded">
    <button id="panel-toggle" class="panel-toggle" aria-label="Collapse panel">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="panel-body">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="measure" role="tab" aria-selected="true">Measure</button>
      <button class="tab" data-tab="strip" role="tab" aria-selected="false">Strip</button>
    </nav>

    <section id="tab-measure" class="tab-panel active" role="tabpanel">
      <p id="hint">Click the map to drop pin <span class="pin-chip pin-a">A</span>.</p>
      <div id="readout" hidden>
        <div>
          <span id="dist-primary" class="big">—</span>
          <span id="dist-primary-unit" class="unit">mi on the trail</span>
        </div>
        <div class="secondary">
          <span id="dist-secondary">—</span> · <span id="dist-straight">—</span>
        </div>
        <p id="warn" class="warn" hidden></p>
      </div>
      <div class="actions">
        <button id="btn-swap" disabled>Swap A ↔ B</button>
        <button id="btn-clear" disabled>Clear</button>
      </div>
      <label class="check"><input id="units-km" type="checkbox" /> Show distances in km (default: miles)</label>
    </section>

    <section id="tab-strip" class="tab-panel" role="tabpanel" hidden>
      <div class="strip-controls">
        <label for="strip-scale">
          Scale <output id="strip-scale-out">10 mi in view</output>
        </label>
        <input id="strip-scale" type="range" min="5" max="20" step="1" value="10" />
      </div>
      <div id="strip-viewport" class="strip-viewport" aria-label="Thames Path waymark strip">
        <div id="strip-axis" class="strip-axis"></div>
        <div id="strip-waymarks" class="strip-waymarks"></div>
        <div id="strip-cursor" class="strip-cursor" role="slider" aria-label="Position on trail" aria-orientation="vertical" aria-valuemin="0" tabindex="0">
          <span class="strip-cursor-label">—</span>
        </div>
      </div>
      <p class="strip-tab-hint">Drag the strip to pan. Drag the blue line to move the cursor. Tap a waymark to view on the map.</p>
    </section>

    <div class="attr">
      Trail from OSM relation 14519665 (© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, ODbL).
    </div>
    </div>
  </section>

  <button id="distance-chip" class="distance-chip" aria-label="Expand measurement panel" hidden>
    <span id="chip-value" class="chip-value">—</span>
    <span id="chip-unit" class="chip-unit">—</span>
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./path.js"></script>
</body>
</html>
